    <title>Short Poem</title>
</head>
<body>
    <h2>My Short Poem</h2>

    <pre>
        Dawn breaks over Tamale,
            <b>golden light</b> spills on the street.

        <i>Children laugh</i>,
            vendors call,dreams wake up too.

        <u>Today</u> we start again,
            <i>strong</i> and <strong>hopeful</strong>
    </pre>
</body>
</html>
